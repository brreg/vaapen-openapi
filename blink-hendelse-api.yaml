    ForseglePall:
      allOf:
      - $ref: "#/components/schemas/HendelsePoltietsBesittelse"
      - type: object
        properties:
          pallId:
            type: string
      description: "\n        Forsegler en pall (klargjør for sending). Setter `pall.forseglet\
        \ = true`.\n        Forutsetning: pallen må finnes.\n    "
      example:
        type: PALL_FORSEGLET
        pallId: b7e2d4c1-8a35-4f7a-9d1c-3f8b6e4a2d15
    HendelsePoltietsBesittelse:
      type: object
      description: "\n            Hendelse som beskriver en endring i politiets besittelse\
        \ av våpen, våpendeler eller\n            'annet våpen'. Feltet `type` er\
        \ diskriminator og bestemmer hvilken subtype dette er.\n            Se undertypene\
        \ for detaljer, og valideringsreglene i KriposEventController\n          \
        \  for fullstendig beskrivelse av hver subtype.\n        "
      discriminator:
        propertyName: type
        mapping:
          PAKKE_OPPRETTET: "#/components/schemas/RegistrerPakke"
          PAKKE_ENDRING_DISTRIKT: "#/components/schemas/EndrePakkeDistrikt"
          PAKKE_TILBAKELEVERT: "#/components/schemas/TilbakeleverPakke"
          PAKKE_ENDRING_KRIPOS: "#/components/schemas/EndrePakkeKripos"
          PAKKE_UTLAANSENDRING: "#/components/schemas/PakkeEndringUtlaan"
          PAKKE_ENDRING_REFERANSESAMLING: "#/components/schemas/PakkeEndringReferansesamling"
          PAKKE_FJERN_FRA_REFERANSESAMLING: "#/components/schemas/PakkeFjernReferansesamling"
          PALL_OPPRETTET: "#/components/schemas/PallUnderKonstruksjon"
          PAKKE_TIL_PALL: "#/components/schemas/PakkerTilPall"
          PAKKE_FRA_PALL: "#/components/schemas/PakkeFraPall"
          PALL_FORSEGLET: "#/components/schemas/ForseglePall"
          PALL_SENDT: "#/components/schemas/SendPall"
          PALL_MOTTATT_KRIPOS: "#/components/schemas/MottaPall"
          PALL_AAPNET: "#/components/schemas/AapnePall"
          PALL_SENDT_FORSVARET: "#/components/schemas/SendForsvaret"
          PALL_ENDELIG_DESTRUERT: "#/components/schemas/EndeligDestruksjon"
          PAKKE_KRIPOS_ETTERREGISTRERING_ENDELIG_DESTRUERT: "#/components/schemas/PakkeEtterregistreringDestruert"
      properties:
        type:
          type: string
          description: "\n        Diskriminator for hendelsestype. Bestemmer hvilken\
            \ subtype av HendelsePoltietsBesittelse som mottas.\n        Se HendelsePoltietsBesittelse\
            \ for oversikt over subtypene.\n    "
          enum:
          - PAKKE_OPPRETTET
          - PAKKE_ENDRING_DISTRIKT
          - PAKKE_TILBAKELEVERT
          - PAKKE_ENDRING_KRIPOS
          - PAKKE_TIL_PALL
          - PAKKE_FRA_PALL
          - PAKKE_UTLAANSENDRING
          - PAKKE_ENDRING_REFERANSESAMLING
          - PAKKE_SENDT
          - PAKKE_MOTTATT
          - PAKKE_KONTROLLERT_KRIPOS
          - PAKKE_KRIPOS_ETTERREGISTRERING_ENDELIG_DESTRUERT
          - PALL_OPPRETTET
          - PALL_FORSEGLET
          - PALL_SENDT
          - PALL_MOTTATT_KRIPOS
          - PALL_SENDT_FORSVARET
          - PALL_AAPNET
          - PALL_ENDELIG_DESTRUERT
          - PAKKE_FJERN_FRA_REFERANSESAMLING
    MottaPall:
      allOf:
      - $ref: "#/components/schemas/HendelsePoltietsBesittelse"
      - type: object
        properties:
          pallId:
            type: string
          mottaker:
            type: string
          status:
            type: string
            enum:
            - UNDER_KONSTRUKSJON
            - MELLOMLAGRET
            - MOTTATT_KRIPOS
            - SENDT_FORSVARET
            - ENDELIG_DESTRUERT
            - SENDT_FRA_POLITI
      description: "\n        Kripos mottar en pall.\n\n        Effekt:\n        -\
        \ `pall.lokasjon`, `pall.mottaker` og `pall.status` settes fra forespørselen.\n\
        \        - `lokasjon` på alle pakker i pallen oppdateres til mottaker.\n\n\
        \        Forutsetninger: pallen må finnes. `status` MÅ være `MOTTATT_KRIPOS`\
        \ eller `MELLOMLAGRET`.\n    "
      example:
        type: PALL_MOTTATT_KRIPOS
        pallId: b7e2d4c1-8a35-4f7a-9d1c-3f8b6e4a2d15
        mottaker: Kripos
        status: MOTTATT_KRIPOS
    Pakke:
      type: object
      description: "\n        Pakke som representerer et innlevert/beslaglagt våpen,\
        \ en våpendel eller et 'annet våpen'.\n        Minst ett av feltene skyteVaapen,\
        \ vaapendel eller annetVaapen MÅ være satt.\n    "
      properties:
        id:
          type: string
        pakkenummer:
          type:
          - string
          - "null"
        sikkerhetskontrollert:
          type:
          - boolean
          - "null"
        kontrollertAv:
          type:
          - string
          - "null"
        lokasjon:
          type: string
        pakkestatus:
          type: string
          description: "\n        Status for en pakke. Sammen med besluttetHandtering\
            \ og innkomstmaate bestemmer pakkestatus\n        hvilken våpenstatus\
            \ et tilhørende våpen/våpendel får, etter følgende kaskade:\n\n      \
            \  1. pakkestatus i REFERANSESAMLING, FERDIGBEHANDLET_KRIPOS, SENDT_FORSVARET,\
            \ ENDELIG_DESTRUERT -> våpenstatus DESTRUERT\n        2. pakkestatus i\
            \ UTLEVERT, INAKTIVT -> våpenstatus AKTIV\n        3. besluttetHandtering\
            \ = DESTRUKSJON -> våpenstatus  SKAL_DESTRUERES\n        4. ellers ->\
            \ våpenstatus gitt av innkomstmaate (se Innkomstmaate)\n\n        MOTTATT_KRIPOS,\
            \ REGISTRERT, UNDER_TRANSPORT og MELLOMLAGRET treffer ingen av de to fø\
            rste\n        regelene og faller derfor gjennom til regel 3/4.\n    "
          enum:
          - REGISTRERT
          - UNDER_TRANSPORT
          - UTLEVERT
          - MELLOMLAGRET
          - MOTTATT_KRIPOS
          - SENDT_FORSVARET
          - ENDELIG_DESTRUERT
          - REFERANSESAMLING
          - FERDIGBEHANDLET_KRIPOS
          - INAKTIVT
        lagerplassering:
          type:
          - string
          - "null"
        tilUtlaan:
          type: boolean
        merknad:
          type:
          - string
          - "null"
        innkomstmaate:
          type: string
          description: "\n        Måten et våpen er kommet inn til politiet på. Bestemmer\
            \ initiell våpenstatus.\n\n        Verdier:\n        - FRIVILLIG_INNLEVERT\
            \ -> våpenstatus INNLEVERT_POLITI\n        - MIDLERTIDIG_INNLEVERT ->\
            \ våpenstatus INNLEVERT_POLITI (er p.t. ikke i bruk)\n        - TILBAKEKALT\
            \ -> våpenstatus INNLEVERT_POLITI\n        - TATT_I_BESLAG -> våpenstatus\
            \ BESLAGLAGT\n    "
          enum:
          - FRIVILLIG_INNLEVERT
          - MIDLERTIDIG_INNLEVERT
          - TILBAKEKALT
          - TATT_I_BESLAG
        besluttetHandtering:
          type: string
          enum:
          - IKKE_BESLUTTET
          - DESTRUKSJON
          - TILBAKELEVERING
        besluttetAv:
          type:
          - string
          - "null"
        annetVaapen:
          oneOf:
          - $ref: "#/components/schemas/AnnetVaapen"
          - type: "null"
        skyteVaapen:
          type:
          - integer
          - "null"
          format: int64
          description: ID til skytevåpen i skytevåpenregisteret.
          example: 987654
        vaapendel:
          type:
          - integer
          - "null"
          format: int64
          description: ID til våpendel i våpendelregisteret.
          example: 123456
        saksreferanse:
          type:
          - string
          - "null"
    PakkeEndringReferansesamling:
