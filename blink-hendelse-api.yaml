        \ oppdaterer pakken og status på tilhørende skytevåpen/våpendel.\n       \
        \ Forutsetning: `pakkestatus` MÅ være en av `MOTTATT_KRIPOS`, `FERDIGBEHANDLET_KRIPOS`,\n\
        \        `REFERANSESAMLING`, `SENDT_FORSVARET` eller `ENDELIG_DESTRUERT`.\n\
        \    "
      example:
        type: PAKKE_ENDRING_KRIPOS
        pakke:
          id: a3f8b12e-9c47-4d8b-b6f2-1e5a7c9d3e02
          pakkenummer: PKG-2026-00042
          sikkerhetskontrollert: true
          kontrollertAv: KRIPOS-9012
          lokasjon: Oslo politidistrikt
          pakkestatus: MOTTATT_KRIPOS
          lagerplassering: Kripos hylle 12A
          tilUtlaan: false
          merknad: Overtatt av Kripos
          innkomstmaate: TATT_I_BESLAG
          besluttetHandtering: DESTRUKSJON
          besluttetAv: KRIPOS-9012
          skyteVaapen: 1
