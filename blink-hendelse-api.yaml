openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: https://vaapen.ppe.brreg.no
  description: Eksternt testmiljø (Pre Prod Ekstern)
paths:
  /blink-hendelse/vaapenrom:
    put:
      tags:
      - vaapenromendring-controller
      summary: Trekk tilbake godkjenning av våpenrom. Status settes til GODKJENNING_TILBAKETRUKKET.
        Saksreferanse og matrikkelnummer kan endres samtidig.
      operationId: endreVaapenrom
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Vaapenrom"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
    post:
      tags:
      - vaapenromendring-controller
      summary: Opprett våpenrom.
      operationId: lagreNyttVaapenrom
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Vaapenrom"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
    delete:
      tags:
      - vaapenromendring-controller
      summary: Slett våpenrom. Status settes til SLETTET.
      operationId: sletteVaapenrom
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /blink-hendelse/kulediameter/{id}:
    put:
      tags:
      - kulediameter-controller
      summary: Oppdater eksisterende kulediameter
      description: Oppdaterer en eksisterende kulediameter identifisert av ID. Returnerer
        den oppdaterte kulediameteren.
      operationId: updateKulediameter
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KulediameterRequest"
        required: true
      responses:
        "200":
          description: Kulediameter oppdatert
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KulediameterDetailed"
        "400":
          description: Ugyldig request-body
        "404":
          description: Kulediameter ikke funnet
  /blink-hendelse/kaliber/{id}:
    put:
      tags:
      - kaliber-controller
      summary: Oppdater eksisterende kaliber
      description: Oppdaterer et eksisterende kaliber identifisert av ID. Returnerer
        det oppdaterte kaliberet.
      operationId: updateCaliber
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KaliberRequest"
        required: true
      responses:
        "200":
          description: Kaliber oppdatert
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KaliberDetailed"
        "400":
          description: Ugyldig request-body
        "404":
          description: Kaliber ikke funnet
  /blink-hendelse/fabrikkmerker/{id}:
    put:
      tags:
      - fabrikkmerke-controller
      summary: Oppdater eksisterende fabrikkmerke
      description: Oppdaterer et eksisterende fabrikkmerke identifisert av ID. Returnerer
        det oppdaterte fabrikkmerket.
      operationId: updateFabrikkmerke
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FabrikkmerkeRequest"
        required: true
      responses:
        "200":
          description: Fabrikkmerke oppdatert
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FabrikkmerkeDetailed"
        "400":
          description: Ugyldig request-body
        "404":
          description: Fabrikkmerke ikke funnet
  /blink-hendelse/aksjoner:
    put:
      tags:
      - aksjon-controller
      summary: Oppdater eksisterenede aksjon
      operationId: oppdaterAksjon
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Aksjon"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
    post:
      tags:
      - aksjon-controller
      summary: Opprett NY aksjon
      operationId: nyAksjon
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Aksjon"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /blink-hendelse/samleromraade:
    post:
      tags:
      - samleromraade-controller
      operationId: lagreNyttSamleromraade
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SamleromraadeEvent"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /blink-hendelse/opprettelse:
    post:
      tags:
      - saksbehandler-opprettelse-controller
      operationId: opprett
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/IKKE_ERVERVSMESSIG_INNFORSEL_SKYTEVAAPEN"
              - $ref: "#/components/schemas/IKKE_ERVERVSMESSIG_INNFORSEL_VAAPENDEL"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /blink-hendelse/loyve/endring:
    post:
      tags:
      - loyveendring-controller
      summary: "Lagre nytt eller endring på ervervsløyve, næringsløyve eller avslag\
        \ på ervervsløyve"
      operationId: lagreEndring
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/AnnetLoyveEndring"
              - $ref: "#/components/schemas/AvslattSoknadEndring"
              - $ref: "#/components/schemas/ErvervsloyveEndring"
              - $ref: "#/components/schemas/NaeringsloyveEndring"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /blink-hendelse/kulediameter:
    get:
      tags:
      - kulediameter-controller
      summary: Hent kulediameter
      description: "Henter alle kulediametere, returnerer en liste med kulediametere,\
        \ Benytt kunAktive for å fltrere på aktive/inaktive"
      operationId: hentKulediameter
      parameters:
      - name: kunAktive
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        "200":
          description: Kulediameter Hentet
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KulediameterDetailed"
    post:
      tags:
      - kulediameter-controller
      summary: Opprett nye kulediameter
      description: Oppretter ny kulediameter i kodelisten basert på innsendt request-body.
        returnerer den nye kulediameteren med ny ID
      operationId: createKulediameter
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KulediameterRequest"
        required: true
      responses:
        "201":
          description: Kulediameter opprettet
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KulediameterDetailed"
        "400":
          description: Ugyldig request-body
        "409":
          description: Kulediameter finnes allerede
  /blink-hendelse/korrigeringer/mottatt:
    post:
      tags:
      - korreksjon-event-controller
      summary: Lagre at en korreksjon har blitt plukket opp av Blink
      operationId: updatePickedUpByBlink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KorreksjonsId"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /blink-hendelse/korrigeringer/endring:
    post:
      tags:
      - korreksjon-event-controller
      summary: "Lagre endring eller korreksjon av våpen eller våpendel, eller eieroverfø\
        ring av våpen eller våpendel"
      operationId: lagreEndring_1
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/VAAPEN"
              - $ref: "#/components/schemas/VAAPENDEL"
              - $ref: "#/components/schemas/VAAPENKORREKSJON"
              - $ref: "#/components/schemas/VAAPENDELKORREKSJON"
              - $ref: "#/components/schemas/EIEROVERFORING_VAAPEN_SAKSBEHANDLER"
              - $ref: "#/components/schemas/EIEROVERFORING_VAAPENDEL_SAKSBEHANDLER"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: "#/components/schemas/ChangeFailed"
                - $ref: "#/components/schemas/ChangeSuccess"
  /blink-hendelse/korrigeringer/avbrutt:
    post:
      tags:
      - korreksjon-event-controller
      summary: Lagre at en korreksjon har blitt bekreftet avbrutt av Blink
      operationId: updateAcknowledgeCancelledByBlink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KorreksjonsId"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /blink-hendelse/kaliber:
    post:
      tags:
      - kaliber-controller
      summary: Opprett nytt kaliber
      description: Oppretter et nytt kaliber basert på innsendt request-body. Returnerer
        det opprettede kaliberet med generert ID.
      operationId: createKaliber
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KaliberRequest"
        required: true
      responses:
        "201":
          description: Kaliber opprettet
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KaliberDetailed"
        "400":
          description: Ugyldig request-body
        "409":
          description: Kaliber finnes allerede
  /blink-hendelse/fabrikkmerker:
    post:
      tags:
      - fabrikkmerke-controller
      summary: Opprett nytt fabrikkmerke
      description: Oppretter et nytt fabrikkmerke basert på innsendt request-body.
        Returnerer det opprettede fabrikkmerket med generert ID.
      operationId: createFabrikkmerke
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FabrikkmerkeRequest"
        required: true
      responses:
        "201":
          description: Fabrikkmerke opprettet
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FabrikkmerkeDetailed"
        "400":
          description: Ugyldig request-body
        "409":
          description: Fabrikkmerke finnes allerede
  /blink-hendelse/besittelse/politi/endring:
    post:
      tags:
      - kripos-event-controller
      summary: Kripos-hendelser (pall/pakke)
      description: "\nRegistrerer en hendelse som beskriver en endring i politiets\
        \ besittelse av våpen eller våpendeler. \nHendelsen kan gjelde en pakke eller\
        \ en pall og er en av 17 subtyper diskriminert av feltet `type`. \nSe schemaet\
        \ for `HendelsePoltietsBesittelse` for detaljer på hver subtype.\n\n### Valideringsregler\n\
        \n| Type | Krav |\n|---|---|\n| `PAKKE_OPPRETTET` | Ny pakke. `pakke.id` må\
        \ være gyldig UUID og ikke finnes fra før. |\n| `PAKKE_KRIPOS_ETTERREGISTRERING_ENDELIG_DESTRUERT`\
        \ | Ny pakke. Etterregistrering av en destruert pakke. `pakke.id` må være\
        \ gyldig UUID og ikke finnes fra før. `besluttetHandtering` må være `DESTRUKSJON`\
        \ og `pakkestatus` må være `ENDELIG_DESTRUERT`. |\n| `PAKKE_ENDRING_DISTRIKT`\
        \ | Endring på pakke fra politidistrikt. Pakken må finnes, og dens nåværende\
        \ status må være `REGISTRERT`, `UNDER_TRANSPORT`, `UTLEVERT`, `MELLOMLAGRET`\
        \ eller `INAKTIVT`. |\n| `PAKKE_ENDRING_KRIPOS` | Endring på pakke fra Kripos.\
        \ Pakken må finnes. Pakkestatus i forespørselen må være `MOTTATT_KRIPOS`,\
        \ `FERDIGBEHANDLET_KRIPOS`, `REFERANSESAMLING`, `SENDT_FORSVARET` eller `ENDELIG_DESTRUERT`.\
        \ |\n| `PAKKE_TILBAKELEVERT`, `PAKKE_ENDRING_REFERANSESAMLING`, `PAKKE_FJERN_FRA_REFERANSESAMLING`,\
        \ `PAKKE_UTLAANSENDRING` | Andre pakkeoperasjoner. Pakken må finnes. |\n|\
        \ `PALL_OPPRETTET` | Ny pall. `pall.id` må være gyldig UUID og ikke finnes\
        \ fra før. `pall.status` må være `UNDER_KONSTRUKSJON` og `pall.pakker` må\
        \ være en tom liste. |\n| `PAKKE_TIL_PALL` | Legge pakker på pall. Alle refererte\
        \ pakker og pallen må finnes. `pakkeIdEr` kan ikke være tom. |\n| `PAKKE_FRA_PALL`\
        \ | Fjerne pakke fra pall. Pakken må finnes, og pallen den ligger på kan ikke\
        \ være forseglet. |\n| `PALL_FORSEGLET`, `PALL_AAPNET`, `PALL_SENDT`, `PALL_ENDELIG_DESTRUERT`\
        \ | Palloperasjoner. Pallen må finnes. |\n| `PALL_MOTTATT_KRIPOS` | Kripos\
        \ mottar pall. Pallen må finnes. `status` i forespørselen må være `MOTTATT_KRIPOS`\
        \ eller `MELLOMLAGRET`. |\n| `PALL_SENDT_FORSVARET` | Send pall til Forsvaret.\
        \ Pallen må finnes og være forseglet. |\n"
      operationId: lagreEndring_2
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/AapnePall"
              - $ref: "#/components/schemas/EndeligDestruksjon"
              - $ref: "#/components/schemas/EndrePakkeDistrikt"
              - $ref: "#/components/schemas/EndrePakkeKripos"
              - $ref: "#/components/schemas/ForseglePall"
              - $ref: "#/components/schemas/MottaPall"
              - $ref: "#/components/schemas/PakkeEndringReferansesamling"
              - $ref: "#/components/schemas/PakkeEndringUtlaan"
              - $ref: "#/components/schemas/PakkeEtterregistreringDestruert"
              - $ref: "#/components/schemas/PakkeFjernReferansesamling"
              - $ref: "#/components/schemas/PakkeFraPall"
              - $ref: "#/components/schemas/PakkerTilPall"
              - $ref: "#/components/schemas/PallUnderKonstruksjon"
              - $ref: "#/components/schemas/RegistrerPakke"
              - $ref: "#/components/schemas/SendForsvaret"
              - $ref: "#/components/schemas/SendPall"
              - $ref: "#/components/schemas/TilbakeleverPakke"
        required: true
      responses:
        "200":
          description: Hendelsen ble akseptert og registrert.
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KriposValidationResult"
              examples:
                Akseptert:
                  description: Akseptert
                  value:
                    status: SUCCESS
                    warnings: []
                    errors: []
        "400":
          description: "Forespørselen ble avvist: body er `KriposValidationResult`\
            \ med detaljer i `errors`."
          content:
            '*/*':
              schema:
                anyOf:
                - $ref: "#/components/schemas/KriposValidationResult"
                - $ref: "#/components/schemas/ErrorMessageModel"
              examples:
                Valideringsfeil:
                  description: Valideringsfeil
                  value:
                    status: ERROR
                    warnings: []
                    errors:
                    - field: pakkestatus
                      errorType: PAKKE_CHANGE_NOT_ALLOWED
  /blink-hendelse/aksjoner/{aksjonsid}:
    delete:
      tags:
      - aksjon-controller
      summary: Slett aksjon
      operationId: slettAksjon
      parameters:
      - name: aksjonsid
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
components:
  schemas:
    Eier:
      type: object
      discriminator:
        propertyName: eiertype
        mapping:
          VIRKSOMHET: "#/components/schemas/EierVirksomhet"
          PERSON: "#/components/schemas/EierPerson"
          UKJENT_INNEHAVER: "#/components/schemas/UkjentInnehaver"
          POLITI: "#/components/schemas/PolitiInnehaver"
      properties:
        id:
          type: integer
          format: int64
        eiertype:
          type: string
          description: Type eier
          enum:
          - PERSON
          - VIRKSOMHET
          - UKJENT_INNEHAVER
          - POLITI
    EierPerson:
      allOf:
      - $ref: "#/components/schemas/DigitalPerson"
      - type: object
        properties:
          id:
            type:
            - integer
            - "null"
            format: int64
            description: Unik identifikator for eieren
            example: 5678
          personidentifikator:
            type: string
            description: Fødselsnummer eller D-nummer
            example: "12345678901"
          navn:
            type:
            - string
            - "null"
            description: Navn på fysisk person - kun visning ved behov
            example: Kari Ole Normann
          foedselsdato:
            type:
            - string
            - "null"
            format: date
            description: Fødselsdato - kun visning ved behov
            example: 1991-01-01
          eiertype:
            type: string
            description: Type eier
            enum:
            - PERSON
            - VIRKSOMHET
            - UKJENT_INNEHAVER
            - POLITI
            example: PERSON
      description: Representerer en person
      required:
      - eiertype
    EierVirksomhet:
      allOf:
      - $ref: "#/components/schemas/DigitalVirksomhet"
      - type: object
        properties:
          id:
            type:
            - integer
            - "null"
            format: int64
            description: Unik identifikator for eieren
            example: 1234
          organisasjonsnummer:
            type: string
            description: Organisasjonsnummer
            example: "123456789"
          navn:
            type:
            - string
            - "null"
            description: Navn på virksomhet - kun visning ved behov
            example: PANGPANG AS
          eiertype:
            type: string
            description: Type eier
            enum:
            - PERSON
            - VIRKSOMHET
            - UKJENT_INNEHAVER
            - POLITI
            example: VIRKSOMHET
      description: Representerer en virksomhet
      required:
      - eiertype
    PolitiInnehaver:
      allOf:
      - $ref: "#/components/schemas/Eier"
      - type: object
        properties:
          id:
            type:
            - integer
            - "null"
            format: int64
            description: Unik intern identifikator for eieren
            example: 5678
          lokasjon:
            type: string
            description: Lokasjon i politiet
            example: Beslagssenter Oslo - Grønland
          importertKategori:
            type: boolean
            description: Importert fra NVR - Bør ryddes
            example: false
          eiertype:
            type: string
            description: Type eier
            enum:
            - PERSON
            - VIRKSOMHET
            - UKJENT_INNEHAVER
            - POLITI
            example: PERSON
      description: Representerer en innehaver uten gyldig indentifikator (person eller
        virksomhet)
      required:
      - eiertype
    UkjentInnehaver:
      allOf:
      - $ref: "#/components/schemas/Eier"
      - type: object
        properties:
          id:
            type:
            - integer
            - "null"
            format: int64
            description: Unik intern identifikator for eieren
            example: 5678
          personidentifikator:
            type: string
            description: "Identifikator for person, som regel fødselsdato"
            example: "311280"
          vaapenkortSid:
            type: string
            description: Referanse til gammelt vaapenkort
            example: 01-1111111111
          navn:
            type:
            - string
            - "null"
            description: Navn på ukjent person
            example: Kari Ole Normann
          adresse:
            type:
            - string
            - "null"
            description: Adressen til ukjent person
            example: Kari Ole Normann
          stilling:
            type:
            - string
            - "null"
            description: Stilling til ukjent person
            example: Diplomat
          telefon:
            type:
            - string
            - "null"
            description: Telefon til ukjent person
            example: +47 13131313
          eiertype:
            type: string
            description: Type eier
            enum:
            - PERSON
            - VIRKSOMHET
            - UKJENT_INNEHAVER
            - POLITI
            example: PERSON
      description: Representerer en innehaver uten gyldig indentifikator (person eller
        virksomhet)
      required:
      - eiertype
    Vaapenrom:
      type: object
      properties:
        id:
          type: string
          description: Unik intern identifikator for våpenrommet. I form av UUID.
        innehaver:
          description: Eier av våpenrommet
          oneOf:
          - $ref: "#/components/schemas/EierPerson"
          - $ref: "#/components/schemas/EierVirksomhet"
          - $ref: "#/components/schemas/PolitiInnehaver"
          - $ref: "#/components/schemas/UkjentInnehaver"
        status:
          type: string
          description: Status på våpenrom
          enum:
          - GODKJENT
          - GODKJENNING_TILBAKETRUKKET
          - SLETTET
          example: GODKJENT
        saksreferanse:
          type: string
          description: Alle våpenrom som innvilges må ha en saksreferanse i websak
        matrikkelnummer:
          type:
          - string
          - "null"
          description: identifikator for fast eiendom i Norge hvor våpenrommet er
        createdDate:
          type:
          - string
          - "null"
          format: date-time
          description: "Tidspunktet når våpenrommet ble opprettet i databasen, blir\
            \ satt på lagringstidspunktet, skal være tom ved innsending"
        deletedDate:
          type:
          - string
          - "null"
          format: date-time
          description: "Tidspunktet når våpenrommet ble soft-slettet i databasen,\
            \ skal være tom ved innsending"
    KulediameterRequest:
      type: object
      properties:
        navn:
          type: string
          minLength: 1
        aktiv:
          type:
          - boolean
          - "null"
      required:
      - navn
    KulediameterDetailed:
      type: object
      properties:
        id:
          type: integer
          format: int32
        navn:
          type: string
        slettetDato:
          type:
          - string
          - "null"
          format: date
    KaliberRequest:
      type: object
      properties:
        navn:
          type: string
          minLength: 1
        aliasBetegnelse:
          type:
          - string
          - "null"
      required:
      - navn
    KaliberDetailed:
      type: object
      properties:
        id:
          type: integer
          format: int32
        navn:
          type: string
        aliasBetegnelse:
          type:
          - string
          - "null"
        slettetDato:
          type:
          - string
          - "null"
          format: date
    FabrikkmerkeRequest:
      type: object
      properties:
        navn:
          type: string
          minLength: 1
        merknad:
