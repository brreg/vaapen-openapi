components:
  schemas:
    RequestPerson:
      type: object
      properties:
        personidentifikator:
          type: string
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time
    Eier:
      type: object
      discriminator:
        propertyName: eiertype
        mapping:
          VIRKSOMHET: "#/components/schemas/EierVirksomhet"
          PERSON: "#/components/schemas/EierPerson"
          UKJENT_INNEHAVER: "#/components/schemas/UkjentInnehaver"
          POLITI: "#/components/schemas/PolitiInnehaver"
      properties:
        id:
          type:
          - integer
          - "null"
          format: int64
        eiertype:
          type: string
          description: Type eier
          enum:
          - PERSON
          - VIRKSOMHET
          - UKJENT_INNEHAVER
          - POLITI
    EierPerson:
      allOf:
      - $ref: "#/components/schemas/Eier"
      - type: object
        properties:
          id:
            type:
            - integer
            - "null"
            format: int64
            description: Unik identifikator for eieren
            example: 5678
          personidentifikator:
            type: string
            description: Fødselsnummer eller D-nummer
            example: "12345678901"
          navn:
            type:
            - string
            - "null"
            description: Navn på fysisk person - kun visning ved behov
            example: Kari Ole Normann
          foedselsdato:
            type:
            - string
            - "null"
            format: date
            description: Fødselsdato - kun visning ved behov
            example: 1991-01-01
          eiertype:
            type: string
            description: Type eier
            enum:
            - PERSON
            - VIRKSOMHET
            - UKJENT_INNEHAVER
            - POLITI
            example: PERSON
      - $ref: "#/components/schemas/DigitalPerson"
      description: Representerer en person
      required:
      - eiertype
    EierVirksomhet:
      allOf:
      - $ref: "#/components/schemas/Eier"
      - type: object
        properties:
          id:
            type:
            - integer
            - "null"
            format: int64
            description: Unik identifikator for eieren
            example: 1234
          organisasjonsnummer:
            type: string
            description: Organisasjonsnummer
            example: "123456789"
          navn:
            type:
            - string
            - "null"
            description: Navn på virksomhet - kun visning ved behov
            example: PANGPANG AS
          eiertype:
            type: string
            description: Type eier
            enum:
            - PERSON
            - VIRKSOMHET
            - UKJENT_INNEHAVER
            - POLITI
            example: VIRKSOMHET
      - $ref: "#/components/schemas/DigitalVirksomhet"
      description: Representerer en virksomhet
      required:
      - eiertype
    PolitiInnehaver:
      allOf:
      - $ref: "#/components/schemas/Eier"
      - type: object
        properties:
          id:
            type:
            - integer
            - "null"
            format: int64
            description: Unik intern identifikator for eieren
            example: 5678
          lokasjon:
            type: string
            description: Lokasjon i politiet
            example: Beslagssenter Oslo - Grønland
          importertKategori:
            type: boolean
            description: Importert fra NVR - Bør ryddes
            example: false
          eiertype:
            type: string
            description: Type eier
            enum:
            - PERSON
            - VIRKSOMHET
            - UKJENT_INNEHAVER
            - POLITI
            example: PERSON
      description: Representerer en innehaver uten gyldig indentifikator (person eller
        virksomhet)
      required:
      - eiertype
    UkjentInnehaver:
      allOf:
      - $ref: "#/components/schemas/Eier"
      - type: object
        properties:
          id:
            type:
            - integer
            - "null"
            format: int64
            description: Unik intern identifikator for eieren
            example: 5678
          personidentifikator:
            type: string
            description: "Identifikator for person, som regel fødselsdato"
            example: "311280"
          vaapenkortSid:
            type: string
            description: Referanse til gammelt vaapenkort
            example: 01-1111111111
          navn:
            type:
            - string
            - "null"
            description: Navn på ukjent person
            example: Kari Ole Normann
          adresse:
            type:
            - string
            - "null"
            description: Adressen til ukjent person
            example: Kari Ole Normann
          stilling:
            type:
            - string
            - "null"
            description: Stilling til ukjent person
            example: Diplomat
          telefon:
            type:
            - string
            - "null"
            description: Telefon til ukjent person
            example: +47 13131313
          eiertype:
            type: string
            description: Type eier
            enum:
            - PERSON
            - VIRKSOMHET
            - UKJENT_INNEHAVER
            - POLITI
            example: PERSON
      description: Representerer en innehaver uten gyldig indentifikator (person eller
        virksomhet)
      required:
      - eiertype
    Vaapenskap:
      type: object
      properties:
        id:
          type: string
          description: Unik intern identifikator for våpenskap.
        innehaver:
          description: Eier av våpenskap
          oneOf:
          - $ref: "#/components/schemas/EierPerson"
          - $ref: "#/components/schemas/EierVirksomhet"
          - $ref: "#/components/schemas/PolitiInnehaver"
          - $ref: "#/components/schemas/UkjentInnehaver"
        serienummer:
          type: string
          description: Serienummer til våpenskapet
        merke:
          type: string
          description: Merke på våpenskapet
        createdDate:
          type:
          - string
          - "null"
          format: date-time
        lastUpdated:
          type:
          - string
          - "null"
          format: date-time
    Vaapenrom:
      type: object
      properties:
        id:
          type: string
          description: Unik intern identifikator for våpenrommet. I form av UUID.
        innehaver:
          description: Eier av våpenrommet
          oneOf:
          - $ref: "#/components/schemas/EierPerson"
          - $ref: "#/components/schemas/EierVirksomhet"
          - $ref: "#/components/schemas/PolitiInnehaver"
          - $ref: "#/components/schemas/UkjentInnehaver"
        status:
          type: string
          description: Status på våpenrom
          enum:
          - GODKJENT
          - GODKJENNING_TILBAKETRUKKET
          - SLETTET
          example: GODKJENT
        saksreferanse:
          type: string
          description: Alle våpenrom som innvilges må ha en saksreferanse i websak
        matrikkelnummer:
          type:
          - string
          - "null"
          description: identifikator for fast eiendom i Norge hvor våpenrommet er
        createdDate:
          type:
          - string
          - "null"
          format: date-time
          description: "Tidspunktet når våpenrommet ble opprettet i databasen, blir\
            \ satt på lagringstidspunktet, skal være tom ved innsending"
        deletedDate:
          type:
          - string
          - "null"
          format: date-time
          description: "Tidspunktet når våpenrommet ble soft-slettet i databasen,\
            \ skal være tom ved innsending"
    BooleanFilter:
      allOf:
      - $ref: "#/components/schemas/SkytevaapenSearchFilter"
      - type: object
        properties:
          field:
            type: string
            enum:
            - INCLUDE_CONNECTED_VAAPENDELER
          value:
            type: boolean
      - $ref: "#/components/schemas/LoyveSearchFilter"
      - type: object
        properties:
          field:
            type: string
            enum:
            - FRITAK_FRA_ALDER
          value:
            type: boolean
    DateFilter:
      allOf:
      - $ref: "#/components/schemas/SkytevaapenSearchFilter"
      - type: object
        properties:
          field:
            type: string
          value:
            type: string
            format: date
          operator:
            type: string
            enum:
            - EQUALS
            - GREATER_EQUAL
            - LESS_EQUAL
      - $ref: "#/components/schemas/LoyveSearchFilter"
      - type: object
        properties:
          field:
            type: string
            enum:
            - VEDTAKSDATO
          value:
            type: string
            format: date
          operator:
            type: string
            enum:
            - EQUALS
            - GREATER_EQUAL
            - LESS_EQUAL
    NumberFilter:
      allOf:
      - $ref: "#/components/schemas/SkytevaapenSearchFilter"
      - type: object
        properties:
          field:
            type: string
            enum:
            - ID
          value:
            type: integer
            format: int64
          operator:
            type: string
            enum:
            - EQUALS
    SkytevaapenFieldBoolean:
      allOf:
      - $ref: "#/components/schemas/VaapenSearchField"
      enum:
      - INCLUDE_CONNECTED_VAAPENDELER
    SkytevaapenFieldDate:
      allOf:
      - $ref: "#/components/schemas/VaapenSearchField"
    SkytevaapenFieldNumber:
      allOf:
      - $ref: "#/components/schemas/VaapenSearchField"
      enum:
      - ID
    SkytevaapenFieldString:
      allOf:
      - $ref: "#/components/schemas/VaapenSearchField"
      enum:
      - SERIENUMMER
      - MODELL
      - EIERPERSON
      - OPPBEVARINGSANSVARLIG
      - EIERVIRKSOMHET
      - FABRIKKMERKE
      - KALIBER
    SkytevaapenFieldType:
      allOf:
      - $ref: "#/components/schemas/VaapenSearchField"
      enum:
      - SKYTEVAAPENTYPE
      - VAAPENDELTYPE
      - FUNKSJONSMAATE
      - AVFYRINGSMEKANISME
      - AVFYRINGSMEKANISME_TONNE
      - VAAPENSTATUS
    SkytevaapenSearchFilter:
      type: object
      discriminator:
        propertyName: type
      properties:
        field:
          oneOf:
          - $ref: "#/components/schemas/SkytevaapenFieldBoolean"
