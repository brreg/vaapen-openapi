      - type: object
        properties:
          pall:
            $ref: "#/components/schemas/Pall"
      description: "\n        Opprettelse av ny pall under konstruksjon.\n\n     \
        \   Effekt: pallen registreres.\n        Forutsetninger: `pall.status` MÅ\
        \ være `UNDER_KONSTRUKSJON` og `pall.pakker` MÅ være tom.\n    "
      example:
        type: PALL_OPPRETTET
        pall:
          id: b7e2d4c1-8a35-4f7a-9d1c-3f8b6e4a2d15
          pallnummer: PALL-2026-0007
          lokasjon: Oslo politidistrikt
          avsender: null
          mottaker: null
          forseglet: false
          status: UNDER_KONSTRUKSJON
          pakker: []
