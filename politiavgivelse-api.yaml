components:
  schemas:
    RequestPerson:
      type: object
      properties:
        personidentifikator:
          type: string
      required:
      - personidentifikator
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time
      required:
      - code
      - details
      - message
      - timestamp
    DigitalEier:
      allOf:
      - $ref: "#/components/schemas/Eier"
      - type: object
        properties:
          navn:
            type:
            - string
            - "null"
          id:
            type:
            - integer
            - "null"
            format: int64
      discriminator:
        propertyName: eiertype
        mapping:
          VIRKSOMHET: "#/components/schemas/EierVirksomhet"
          PERSON: "#/components/schemas/EierPerson"
      required:
      - eiertype
    DigitalPerson:
      allOf:
      - $ref: "#/components/schemas/DigitalEier"
      - type: object
        properties:
          id:
            type:
            - integer
            - "null"
            format: int64
          personidentifikator:
            type: string
          navn:
            type:
            - string
            - "null"
          foedselsdato:
            type:
            - string
            - "null"
            format: date
      required:
      - eiertype
      - personidentifikator
    DigitalVirksomhet:
      allOf:
      - $ref: "#/components/schemas/DigitalEier"
      - type: object
        properties:
          id:
            type:
            - integer
            - "null"
            format: int64
          organisasjonsnummer:
            type: string
          navn:
            type:
            - string
            - "null"
      required:
      - eiertype
      - organisasjonsnummer
    Eier:
      type: object
      discriminator:
        propertyName: eiertype
        mapping:
          VIRKSOMHET: "#/components/schemas/EierVirksomhet"
          PERSON: "#/components/schemas/EierPerson"
          UKJENT_INNEHAVER: "#/components/schemas/UkjentInnehaver"
          POLITI: "#/components/schemas/PolitiInnehaver"
      properties:
        id:
          type:
          - integer
          - "null"
          format: int64
        eiertype:
          type: string
          description: Type eier
          enum:
          - PERSON
          - VIRKSOMHET
          - UKJENT_INNEHAVER
          - POLITI
      required:
      - eiertype
    EierPerson:
      allOf:
      - $ref: "#/components/schemas/Eier"
      - type: object
        properties:
          id:
            type:
            - integer
            - "null"
            format: int64
            description: Unik identifikator for eieren
            example: 5678
          personidentifikator:
            type: string
            description: Fødselsnummer eller D-nummer
            example: "12345678901"
          navn:
            type:
            - string
            - "null"
            description: Navn på fysisk person - kun visning ved behov
            example: Kari Ole Normann
          foedselsdato:
            type:
            - string
            - "null"
            format: date
            description: Fødselsdato - kun visning ved behov
            example: 1991-01-01
          eiertype:
            type: string
            description: Type eier
            enum:
            - PERSON
            - VIRKSOMHET
            - UKJENT_INNEHAVER
            - POLITI
            example: PERSON
      - $ref: "#/components/schemas/DigitalPerson"
      description: Representerer en person
      required:
      - eiertype
      - personidentifikator
