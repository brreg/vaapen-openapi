          besluttetHandtering: DESTRUKSJON
          besluttetAv: OSLO-5678
          skyteVaapen: 1
          saksreferanse: OSLO-2026-01234
    EndrePakkeKripos:
      allOf:
      - $ref: "#/components/schemas/HendelsePoltietsBesittelse"
      - type: object
        properties:
          pakke:
            $ref: "#/components/schemas/Pakke"
      description: "\n        Endring på pakke utført av Kripos.\n\n        Effekt:\
        \ oppdaterer pakken og status på tilhørende skytevåpen/våpendel.\n       \
        \ Forutsetning: `pakkestatus` MÅ være en av `MOTTATT_KRIPOS`, `FERDIGBEHANDLET_KRIPOS`,\n\
        \        `REFERANSESAMLING`, `SENDT_FORSVARET` eller `ENDELIG_DESTRUERT`.\n\
        \    "
