      allOf:
      - $ref: "#/components/schemas/HendelsePoltietsBesittelse"
      - type: object
        properties:
          pakke:
            $ref: "#/components/schemas/Pakke"
      description: "\n        Registrering av en ny pakke.\n\n        Effekt:\n  \
        \      - Pakken registreres.\n        - Status på tilhørende skytevåpen og/eller\
        \ våpendel oppdateres i henhold til pakkens\n          pakkestatus, besluttetHandtering\
        \ og innkomstmaate.\n\n        Forutsetning: pakken må ha minst ett av `skyteVaapen`,\
        \ `vaapendel` eller `annetVaapen`.\n    "
      example:
        type: PAKKE_OPPRETTET
        pakke:
          id: a3f8b12e-9c47-4d8b-b6f2-1e5a7c9d3e02
          pakkenummer: PKG-2026-00042
          sikkerhetskontrollert: true
          kontrollertAv: OSLO-1234
          lokasjon: Oslo politidistrikt
          pakkestatus: REGISTRERT
          lagerplassering: "Hylle 3B, rom 12"
          tilUtlaan: false
          merknad: Innlevert etter tilbakekalling av tillatelse
          innkomstmaate: TILBAKEKALT
          besluttetHandtering: IKKE_BESLUTTET
          besluttetAv: null
          skyteVaapen: 1
          saksreferanse: OSLO-2026-01234
    SendForsvaret:
      allOf:
      - $ref: "#/components/schemas/HendelsePoltietsBesittelse"
      - type: object
        properties:
          pallId:
            type: string
      description: "\n        Sender pall fra Kripos til Forsvaret for destruksjon.\
        \ Krever ingen mottaksbekreftelse.\n\n        Effekt: `pall.avsender` settes\
        \ til `Kripos`, `pall.lokasjon` til `Forsvaret`, og `pall.status = SENDT_FORSVARET`.\n\
        \        Forutsetning: pallen må finnes og være forseglet.\n    "
