        \   Effekt: koblingen mellom pakke og pall fjernes.\n        Forutsetning:\
        \ pallen pakken ligger på kan ikke være forseglet.\n    "
      example:
        type: PAKKE_FRA_PALL
        pakkeId: a3f8b12e-9c47-4d8b-b6f2-1e5a7c9d3e02
    PakkerTilPall:
      allOf:
