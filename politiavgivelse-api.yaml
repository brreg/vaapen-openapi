        \      Effekt: oppdaterer pakken og status på tilhørende skytevåpen/våpendel.\n\
        \        Forutsetning: `pakkestatus` MÅ være `REGISTRERT`, `UNDER_TRANSPORT`\
        \ eller `MELLOMLAGRET`.\n    "
      example:
        type: PAKKE_ENDRING_DISTRIKT
        pakke:
          id: a3f8b12e-9c47-4d8b-b6f2-1e5a7c9d3e02
          pakkenummer: PKG-2026-00042
          sikkerhetskontrollert: true
