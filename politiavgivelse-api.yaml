  /avgivelse/history/vaapenanddel:
    get:
      tags:
      - history-controller
      summary: "Hent historikk for våpen og våpendel. Filtrer på endringsaarsak, fromTime,\
        \ toTime, og paginer med offset og limit"
      description: |-
        Returnerer en rad per endringshendelse.

        Filtrering: `Endringsaarsak`, `fromTime`, `toTime`
        Paginering: `offset`, `limit`

        `historyId` er id for raden i historikktabellen, `id` er id for objektet det er gjort endring på.

        `changeType` angir type endring: `C` (opprettet) eller `U` (oppdatert). Slettinger har ikke egen changeType, men vises som en status på objektet, f.eks. `vaapenstatus: SLETTET`.

        **Merk:** `limit` kan overskrides. Rader med samme endringstidspunkt returneres alltid samlet, f.eks. et våpen med våpendeler med samme tidsstempel, slik at ingen rader tapes ved paginering.
      operationId: findVaapenAndDelHistory
      parameters:
      - name: endringsaarsak
        in: query
        required: false
        schema:
          type: string
          enum:
          - MIGRERING
          - SAKSBEHANDLERENDRING
          - FORHANDLERENDRING
          - EIEROVERFORING
          - LAGERBEHOLDNING
          - FOLKEREGISTER
          - POLITIETS_BESITTELSE
          - IMPORT
          - MASKINELL
      - name: fromTime
        in: query
        description: "Lokal tid i Europe/Oslo, format `yyyy-MM-ddTHH:mm:ss`."
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-08-31T12:00:00
      - name: toTime
        in: query
        description: "Lokal tid i Europe/Oslo, format `yyyy-MM-ddTHH:mm:ss`."
        required: false
        schema:
          type: string
          format: date-time
        example: 2026-08-31T12:00:00
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: HistoryRowRegistreringsobjekt
          content:
            application/json:
              example: "\n                                [\n                    \
                \              {\n                                    \"type\": \"\
                SKYTEVAAPEN\",\n                                    \"historyId\"\
                : 1042,\n                                    \"id\": 501,\n      \
                \                              \"changeType\": \"U\",\n          \
                \                          \"endringsaarsak\": \"SAKSBEHANDLERENDRING\"\
                ,\n                                    \"saksreferanse\": \"2026/12345\"\
                ,\n                                    \"endringstidspunkt\": \"2026-08-31T12:00:00\"\
                ,\n                                    \"objekt\": {\n           \
                \                           \"id\": 501,\n                       \
                \               \"skytevaapentype\": \"RIFLE\",\n                \
                \                      \"vaapenstatus\": \"AKTIV\"\n             \
                \                         ...\n                                  \
                \  }\n                                  }\n                      \
                \          ]\n                                "
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
