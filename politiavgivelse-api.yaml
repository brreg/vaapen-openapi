      allOf:
      - $ref: "#/components/schemas/HendelsePoltietsBesittelse"
      - type: object
        properties:
          pall:
            $ref: "#/components/schemas/Pall"
      description: "\n        Opprettelse av ny pall under konstruksjon.\n\n     \
        \   Effekt: pallen registreres.\n        Forutsetninger: `pall.status` MÅ\
        \ være `UNDER_KONSTRUKSJON` og `pall.pakker` MÅ være tom.\n    "
      example:
        type: PALL_OPPRETTET
        pall:
          id: b7e2d4c1-8a35-4f7a-9d1c-3f8b6e4a2d15
          pallnummer: PALL-2026-0007
          lokasjon: Oslo politidistrikt
          avsender: null
          mottaker: null
          forseglet: false
          status: UNDER_KONSTRUKSJON
          pakker: []
      required:
      - pall
      - type
    ReferansesamlingEntry:
      type: object
      properties:
        id:
          type: string
        hyllebeskrivelse:
          type:
          - string
          - "null"
        samlingskode:
          type:
          - string
          - "null"
        tilleggsinformasjon:
          type: array
          items:
            type: string
            enum:
            - IKKE_PROVESKYT
            - DEAKTIVERT
        pakke:
          $ref: "#/components/schemas/Pakke"
      required:
      - id
      - pakke
      - tilleggsinformasjon
    RegistrerPakke:
      allOf:
      - $ref: "#/components/schemas/HendelsePoltietsBesittelse"
      - type: object
        properties:
          pakke:
            $ref: "#/components/schemas/Pakke"
      description: "\n        Registrering av en ny pakke.\n\n        Effekt:\n  \
        \      - Pakken registreres.\n        - Status på tilhørende skytevåpen og/eller\
        \ våpendel oppdateres i henhold til pakkens\n          pakkestatus, besluttetHandtering\
        \ og innkomstmaate.\n\n        Forutsetning: pakken må ha minst ett av `skyteVaapen`,\
        \ `vaapendel` eller `annetVaapen`.\n    "
      example:
        type: PAKKE_OPPRETTET
        pakke:
          id: a3f8b12e-9c47-4d8b-b6f2-1e5a7c9d3e02
          pakkenummer: PKG-2026-00042
          sikkerhetskontrollert: true
          kontrollertAv: OSLO-1234
          lokasjon: Oslo politidistrikt
          pakkestatus: REGISTRERT
          lagerplassering: "Hylle 3B, rom 12"
          tilUtlaan: false
          merknad: Innlevert etter tilbakekalling av tillatelse
          innkomstmaate: TILBAKEKALT
          besluttetHandtering: IKKE_BESLUTTET
          besluttetAv: null
          skyteVaapen: 1
          saksreferanse: OSLO-2026-01234
      required:
      - pakke
      - type
    SendForsvaret:
      allOf:
      - $ref: "#/components/schemas/HendelsePoltietsBesittelse"
      - type: object
        properties:
          pallId:
            type: string
      description: "\n        Sender pall fra Kripos til Forsvaret for destruksjon.\
        \ Krever ingen mottaksbekreftelse.\n\n        Effekt: `pall.avsender` settes\
        \ til `Kripos`, `pall.lokasjon` til `Forsvaret`, og `pall.status = SENDT_FORSVARET`.\n\
        \        Forutsetning: pallen må finnes og være forseglet.\n    "
      example:
        type: PALL_SENDT_FORSVARET
        pallId: b7e2d4c1-8a35-4f7a-9d1c-3f8b6e4a2d15
      required:
      - pallId
      - type
    SendPall:
      allOf:
      - $ref: "#/components/schemas/HendelsePoltietsBesittelse"
      - type: object
        properties:
          pallId:
            type: string
          avsender:
            type: string
          mottaker:
            type: string
      description: "\n        Sender en pall fra et politidistrikt til Kripos (eller\
        \ annen mottaker).\n\n        Effekt: pallens `avsender` og `mottaker` settes,\
        \ og `status = SENDT_FRA_POLITI`.\n        Forutsetning: pallen må finnes.\n\
        \    "
      example:
        type: PALL_SENDT
        pallId: b7e2d4c1-8a35-4f7a-9d1c-3f8b6e4a2d15
        avsender: Oslo politidistrikt
        mottaker: Kripos
      required:
      - avsender
      - mottaker
      - pallId
      - type
    TilbakeleverPakke:
      allOf:
      - $ref: "#/components/schemas/HendelsePoltietsBesittelse"
      - type: object
        properties:
          pakkeId:
            type: string
          besluttetAv:
            type: string
      description: "\n        Tilbakelevering av pakke til registrert eier.\n\n  \
        \      Effekt:\n        - Pakken får `besluttetHandtering = TILBAKELEVERING`,\
        \ `besluttetAv` settes, og `pakkestatus = UTLEVERT`.\n        - Tilhørende\
