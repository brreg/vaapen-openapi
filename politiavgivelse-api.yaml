      - type: object
        properties:
          pallId:
            type: string
          pakkeIdEr:
            type: array
            items:
              type: string
      description: "\n        Legger en eller flere pakker på en pall.\n\n       \
        \ Effekt: hver pakke i `pakkeIdEr` knyttes til pallen.\n        Forutsetning:\
        \ `pakkeIdEr` kan ikke være tom.\n    "
      example:
        type: PAKKE_TIL_PALL
        pallId: b7e2d4c1-8a35-4f7a-9d1c-3f8b6e4a2d15
        pakkeIdEr:
        - a3f8b12e-9c47-4d8b-b6f2-1e5a7c9d3e02
