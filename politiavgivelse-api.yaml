openapi: 3.1.0
info:
  title: politiavgivelse-api
  description: Avgivelse for api'er til politiet
  version: "0.1"
servers:
- url: https://vaapen.ppe.brreg.no
  description: Eksternt testmiljø (Pre Prod Ekstern)
- url: https://vaapen.ut1.brreg.no
  description: Utviklingsmiljø
paths:
  /avgivelse/vaapenskap/person:
    post:
      tags:
      - vaapenoppbevaring-controller
      summary: Search for vaapenskap using personidentifikator
      operationId: findVaapenskapByPerson
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPerson"
        required: true
      responses:
        "200":
          description: Alle vaapenskap til person
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vaapenskap"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /avgivelse/vaapenrom/person:
    post:
      tags:
      - vaapenoppbevaring-controller
      summary: Search for vaapenrom using personidentifikator
      operationId: findVaapenromBySearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPerson"
        required: true
      responses:
        "200":
          description: "Alle vaapenrom til person, både godkjente og ikke"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vaapenrom"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /avgivelse/vaapendel/search:
    post:
      tags:
      - search
      summary: Søk etter våpendeler med SearchQuery
      description: "Cursor-paginering: send `fromId` (start `0`), bruk `lastId` fra\
        \ svaret som neste `fromId`. Tomt resultat er siste side."
      operationId: findVaapendelBySearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaapenSearchQuery"
            examples:
              Hent alle våpendeler:
                summary: Hent alle våpendeler med cursor-paginering (anbefalt metode)
                description: Hent alle våpendeler
                value:
                  fromId: 0
                  limit: 50
              Filtrert søk:
                summary: Filtrer på våpenstatus
                description: Filtrert søk
                value:
                  filters:
                  - type: TYPE
                    field: VAAPENSTATUS
                    values:
                    - AKTIV
                  combineWith: AND
                  fromId: 0
                  limit: 50
        required: true
      responses:
        "200":
          description: Alle våpendeler filtrert i henhold til VaapenSearchQuery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponseVaapendel"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /avgivelse/vaapen/search:
    post:
      tags:
      - search
      summary: Søk etter skytevåpen med SearchQuery
      description: "Cursor-paginering: send `fromId` (start `0`), bruk `lastId` fra\
        \ svaret som neste `fromId`. Tomt resultat er siste side."
      operationId: findVaapenBySearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaapenSearchQuery"
            examples:
              Hent alle skytevåpen:
                summary: Hent alle skytevåpen med cursor-paginering (anbefalt metode)
                description: Hent alle skytevåpen
                value:
                  fromId: 0
                  limit: 50
              Filtrert søk:
                summary: Filtrer på våpenstatus
                description: Filtrert søk
                value:
                  filters:
                  - type: TYPE
                    field: VAAPENSTATUS
                    values:
                    - AKTIV
                  combineWith: AND
                  fromId: 0
                  limit: 50
        required: true
      responses:
        "200":
          description: Alle skytevåpen filtrert i henhold til VaapenSearchQuery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponseSkytevaapen"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /avgivelse/history/eieroverforingslogg/vaapendel:
    post:
      tags:
      - history-controller
      summary: "Hent eieroverføringslogg for våpendel. Filtrer på involvert eier,\
        \ vaapendelId, og paginer med offset og limit"
      description: '`nyttObjekt` og `tidligereObjekt` er objektet etter/før overføringen.
        `tilInnehaver`/`fraInnehaver` er ny og forrige innehaver. `tidligereHistorikkId`
        peker til historyId for forrige tilstand.'
      operationId: findEieroverforingsloggVaapendel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EieroverforingsloggRequest"
        required: true
      responses:
        "200":
          description: EieroverforingsloggVaapendel
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EieroverforingsloggVaapendel"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /avgivelse/history/eieroverforingslogg/skytevaapen:
    post:
      tags:
      - history-controller
      summary: "Hent eieroverføringslogg for skytevåpen. Filtrer på involvert eier,\
        \ vaapenId, og paginer med offset og limit"
      description: '`nyttObjekt` og `tidligereObjekt` er objektet etter/før overføringen.
        `tilInnehaver`/`fraInnehaver` er ny og forrige innehaver. `tidligereHistorikkId`
        peker til historyId for forrige tilstand.'
      operationId: findEieroverforingsloggSkytevaapen
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EieroverforingsloggRequest"
        required: true
      responses:
        "200":
          description: EieroverforingsloggVaapen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EieroverforingsloggVaapen"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /avgivelse/ervervsloyve/search:
    post:
      tags:
      - search
      summary: Søk etter ervervsløyve med LoyveSearchQuery
      description: Paginering med `offset`/`limit`. Nye og endrede løyver dukker også
        opp via `/avgivelse/history/loyve`.
      operationId: findErvervsloyveBySearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoyveSearchQuery"
            examples:
              Hent alle ervervsløyver:
                summary: Hent alle uten filter
                description: Hent alle ervervsløyver
                value:
                  limit: 50
                  offset: 0
              Filtrert søk:
                summary: Filtrer på ervervstype
                description: Filtrert søk
                value:
                  filters:
                  - type: TYPE
                    field: ERVERVSTYPE
                    values:
                    - SKYTEVAAPEN
                  combineWith: AND
                  limit: 50
                  offset: 0
        required: true
      responses:
        "200":
          description: Alle ervervsloyver filtrert i henhold til LoyveSearchQuery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponseErvervsloyve"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /avgivelse/ervervsloyve/avslag/eier:
    post:
      tags:
      - avslag
      summary: Hent avslag på eier
      operationId: findAvslagVaapensoknad
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/EierPerson"
              - $ref: "#/components/schemas/EierVirksomhet"
              - $ref: "#/components/schemas/PolitiInnehaver"
              - $ref: "#/components/schemas/UkjentInnehaver"
        required: true
      responses:
        "200":
          description: Alle registrerte avslag på ervervsløyver for eier
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvslattSoknad"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /avgivelse/besittelse/hendelse/valider:
    post:
      tags:
      - kripos-controller
      operationId: validerHendelse
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/AapnePall"
              - $ref: "#/components/schemas/EndeligDestruksjon"
              - $ref: "#/components/schemas/EndrePakkeDistrikt"
              - $ref: "#/components/schemas/EndrePakkeKripos"
              - $ref: "#/components/schemas/ForseglePall"
              - $ref: "#/components/schemas/MottaPall"
              - $ref: "#/components/schemas/PakkeEndringReferansesamling"
              - $ref: "#/components/schemas/PakkeEndringUtlaan"
              - $ref: "#/components/schemas/PakkeEtterregistreringDestruert"
              - $ref: "#/components/schemas/PakkeFjernReferansesamling"
              - $ref: "#/components/schemas/PakkeFraPall"
              - $ref: "#/components/schemas/PakkerTilPall"
              - $ref: "#/components/schemas/PallUnderKonstruksjon"
              - $ref: "#/components/schemas/RegistrerPakke"
              - $ref: "#/components/schemas/SendForsvaret"
              - $ref: "#/components/schemas/SendPall"
              - $ref: "#/components/schemas/TilbakeleverPakke"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KriposValidationResult"
  /avgivelse/andreloyver/virksomhet:
    post:
      tags:
      - annet-loyve-controller
      summary: Search for annetLoyve using organisasjonsnummer
      operationId: findAndreLoyverVirksomhet
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestVirksomhet"
        required: true
      responses:
        "200":
          description: All annetLoyve for virksomhet
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: "#/components/schemas/Ammunisjonskjoployve"
                  - $ref: "#/components/schemas/Ammunisjonssamlerloyve"
                  - $ref: "#/components/schemas/GodkjentSamlerloyve"
                  - $ref: "#/components/schemas/GodkjentSkytebaneloyve"
                  - $ref: "#/components/schemas/GodkjentSkytterforeningsloyve"
                  - $ref: "#/components/schemas/Hoykapasitetsmagasinloyve"
                  - $ref: "#/components/schemas/IkkeSkytevaapenErvervsloyve"
                  - $ref: "#/components/schemas/Laaneloyve"
                  - $ref: "#/components/schemas/MidlertidigInnforselsloyve"
                  - $ref: "#/components/schemas/Naeringsimportloyve"
                  - $ref: "#/components/schemas/Piratbeskyttelsesloyve"
                  - $ref: "#/components/schemas/Privatimportloyve"
                  - $ref: "#/components/schemas/Utforrselsloyve"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /avgivelse/andreloyver/person:
    post:
      tags:
      - annet-loyve-controller
      summary: Search for annetLoyve using personidentifikator
      description: Returns aktiv AnnetLoyve. Optional filter using the 'inkluderInaktiv'
        query parameter.
      operationId: findAndreLoyverPerson
      parameters:
      - name: inkluderInaktiv
        in: query
        description: |-
          Optional filter for user status.
                          If provided and set to true; inaktive, ugyldige and aktive annetLoyve are returned.
                          Valid values: 'true', 'false'.
                          Defaults to false if omitted, and will return only aktive annetLoyve.
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPerson"
        required: true
      responses:
        "200":
          description: Alle annetLoyve for person
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: "#/components/schemas/Ammunisjonskjoployve"
                  - $ref: "#/components/schemas/Ammunisjonssamlerloyve"
                  - $ref: "#/components/schemas/GodkjentSamlerloyve"
                  - $ref: "#/components/schemas/GodkjentSkytebaneloyve"
                  - $ref: "#/components/schemas/GodkjentSkytterforeningsloyve"
                  - $ref: "#/components/schemas/Hoykapasitetsmagasinloyve"
                  - $ref: "#/components/schemas/IkkeSkytevaapenErvervsloyve"
                  - $ref: "#/components/schemas/Laaneloyve"
                  - $ref: "#/components/schemas/MidlertidigInnforselsloyve"
                  - $ref: "#/components/schemas/Naeringsimportloyve"
                  - $ref: "#/components/schemas/Piratbeskyttelsesloyve"
                  - $ref: "#/components/schemas/Privatimportloyve"
                  - $ref: "#/components/schemas/Utforrselsloyve"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /avgivelse/andreloyver:
    post:
      tags:
      - search
      summary: Search for annetLoyve using AnnetLoyveSearchQuery
      description: Returns annetLoyve of the given types. `filters` cannot be empty.
        Paging with `limit` (default 50) and `offset` (default 0).
      operationId: findAndreLoyver
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnetLoyveSearchQuery"
            examples:
              Filter by type:
                summary: Get all active piratbeskyttelse annetLoyve
                description: Filter by type
                value:
                  filters:
                  - PIRATBESKYTTELSE
                  inkluderInaktive: false
                  limit: 50
                  offset: 0
        required: true
      responses:
        "200":
          description: All annetLoyve filtered by AnnetLoyveSearchQuery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnetLoyveSearchResponseAnnetLoyve"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /avgivelse/aksjoner/virksomhet:
    post:
      tags:
      - aksjon-controller
      summary: Get aksjoner for virksomhet
      operationId: getAksjonerOnVirksomhet
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestVirksomhet"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Aksjon"
  /avgivelse/aksjoner/person:
    post:
      tags:
      - aksjon-controller
      summary: Get aksjoner for person
      operationId: getAksjonerOnPerson
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPerson"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Aksjon"
  /avgivelse/samleromraade:
    get:
      tags:
      - samler-controller
      operationId: getSamleromraaderOnPerson
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPerson"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Samleromraade"
  /avgivelse/naeringsloyver:
    get:
      tags:
      - naeringsloyve-controller
      operationId: findAllNaeringsloyver
      parameters:
      - name: organisasjonsnummer
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Naeringsloyve"
  /avgivelse/korreksjon/vaapendel:
    get:
      tags:
      - korreksjons-controller
      operationId: getNextVaapendelKorreksjon
      responses:
        "200":
          description: Get next available Vaapendel proposal. See Schemas for details
            on proposalId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaapendelProposal"
        "404":
          description: No available proposal at this time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaapendelProposal"
  /avgivelse/korreksjon/skytevaapen:
    get:
      tags:
      - korreksjons-controller
      operationId: getNextSkytevaapenKorreksjon
      responses:
        "200":
          description: Get next available Skytevaapen proposal. See Schemas for details
            on proposalId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkyteVaapenProposal"
        "404":
          description: No available proposal at this time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkyteVaapenProposal"
  /avgivelse/korreksjon/avbrutt/ids:
    get:
      tags:
      - korreksjons-controller
      operationId: getCancelledKorreksjonIds
      responses:
        "200":
          description: List of cancelled korreksjon IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
  /avgivelse/korreksjon:
    get:
      tags:
      - korreksjons-controller
      operationId: getNextKorreksjonsForslag
      responses:
        "200":
          description: Get next available proposal. See Schemas for details on proposalId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "404":
          description: No available proposal at this time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
  /avgivelse/kodelister/vaapendeltyper:
    get:
      tags:
      - kodeliste-controller
      operationId: findVaapendeltype
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kodeliste"
  /avgivelse/kodelister/sluttstykketyper:
    get:
      tags:
      - kodeliste-controller
      operationId: findSluttstykketype
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kodeliste"
  /avgivelse/kodelister/skytterorganisasjoner:
    get:
      tags:
      - kodeliste-controller
      operationId: findSkytterorganisasjoner
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kodeliste"
  /avgivelse/kodelister/skytevaapentyper:
    get:
      tags:
      - kodeliste-controller
      operationId: findSkytevaapentype
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kodeliste"
  /avgivelse/kodelister/skyteprogram:
    get:
      tags:
      - kodeliste-controller
      operationId: findSkyteprogram
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skyteprogram"
  /avgivelse/kodelister/lademekanismer:
    get:
      tags:
      - kodeliste-controller
      operationId: findLademekanisme
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kodeliste"
  /avgivelse/kodelister/laaskassetyper:
    get:
      tags:
      - kodeliste-controller
      operationId: findLaaskassetype
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kodeliste"
  /avgivelse/kodelister/kulediameter:
    get:
      tags:
      - kodeliste-controller
      operationId: findKulediameter
      parameters:
      - name: kunAktive
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kulediameter"
  /avgivelse/kodelister/kaliber:
    get:
      tags:
      - kodeliste-controller
      operationId: findKaliber
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kaliber"
  /avgivelse/kodelister/funksjonsmaater:
    get:
      tags:
      - kodeliste-controller
      operationId: findFunksjonsmaate
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kodeliste"
  /avgivelse/kodelister/fabrikkmerker:
    get:
      tags:
      - kodeliste-controller
      operationId: findFabrikkmerke
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fabrikkmerke"
  /avgivelse/kodelister/avfyringsmekanismer:
    get:
      tags:
      - kodeliste-controller
      operationId: findAvfyringmekanisme
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kodeliste"
  /avgivelse/innehaver/person/personermedugyldigstatus:
    get:
      tags:
      - innehaver-controller
      summary: 'Hent personer med ugyldig status. '
      operationId: findInnehaverMedUgyldigStatus
      parameters:
      - name: sekvensnummer
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: A list of PersonMedFolkeregisterStatus objects where status
            is not AKTIV or BOSATT
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonMedFolkeregisterStatus"
        "400":
          description: Bad request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /avgivelse/import/beholdning/{loyveid}:
    get:
      tags:
      - import-controller
      operationId: findImportbeholdning
      parameters:
      - name: loyveid
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  oneOf:
                  - $ref: "#/components/schemas/Skytevaapen"
                  - $ref: "#/components/schemas/Vaapendel"
                  - $ref: "#/components/schemas/Laaskasse"
                  - $ref: "#/components/schemas/Pipe"
