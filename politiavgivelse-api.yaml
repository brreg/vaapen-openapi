        type: PALL_SENDT_FORSVARET
        pallId: b7e2d4c1-8a35-4f7a-9d1c-3f8b6e4a2d15
    SendPall:
      allOf:
      - $ref: "#/components/schemas/HendelsePoltietsBesittelse"
      - type: object
        properties:
          pallId:
            type: string
          avsender:
            type: string
          mottaker:
            type: string
      description: "\n        Sender en pall fra et politidistrikt til Kripos (eller\
        \ annen mottaker).\n\n        Effekt: pallens `avsender` og `mottaker` settes,\
        \ og `status = SENDT_FRA_POLITI`.\n        Forutsetning: pallen må finnes.\n\
        \    "
      example:
        type: PALL_SENDT
        pallId: b7e2d4c1-8a35-4f7a-9d1c-3f8b6e4a2d15
        avsender: Oslo politidistrikt
        mottaker: Kripos
